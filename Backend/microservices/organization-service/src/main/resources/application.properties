spring.application.name=organization-service
server.port=8083

# H2 (base en memoire)
# PostgreSQL (Docker)
spring.datasource.url=jdbc:postgresql://localhost:5433/organization_db
spring.datasource.username=nexus
spring.datasource.password=nexus123
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Eureka

eureka.client.service-url.defaultZone=http://localhost:8761/eureka
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.prefer-ip-address=true

# Actuator
management.endpoints.web.exposure.include=health,info,metrics,env,beans,mappings,loggers
management.endpoint.health.show-details=always
info.app.name=organization-service
info.app.description=Gestion des organisations, equipes, membres et partenariats
info.app.version=1.0.0