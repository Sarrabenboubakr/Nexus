
spring.application.name=collaboration-service
server.port=8086

# ==========================================
# MONGODB CONFIGURATION
# ==========================================

spring.mongodb.uri=mongodb://localhost:27018/nexus_collaboration

# ==========================================
# EUREKA CLIENT - TWO EUREKA SERVERS
# ==========================================

eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

eureka.client.service-url.defaultZone=http://peer1:8761/eureka/,http://peer2:8762/eureka/,http://localhost:8762/eureka/

eureka.instance.instance-id=${spring.application.name}:${server.port}
eureka.instance.prefer-ip-address=true

# ==========================================
# SPRING BOOT ACTUATOR - OBSERVABILITY
# ==========================================

management.endpoints.web.exposure.include=health,info,metrics

management.endpoint.health.show-details=always

management.info.env.enabled=true

# Application information
info.app.name=Collaboration Service
info.app.description=Discussions, messages et mentions
info.app.version=1.0.0

# ==========================================
# SWAGGER / OPENAPI
# ==========================================

springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha
