
spring.application.name=notification-service
server.port=8088

# MongoDB
spring.mongodb.uri=mongodb://localhost:27018/nexus_notification

# Eureka
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.instance-id=${spring.application.name}:${server.port}
eureka.instance.prefer-ip-address=true

# Actuator
management.endpoints.web.exposure.include=health,info,metrics,mappings
management.endpoint.health.show-details=always
management.info.env.enabled=true

info.app.name=Notification Service
info.app.description=Gestion des notifications
info.app.version=1.0.0
