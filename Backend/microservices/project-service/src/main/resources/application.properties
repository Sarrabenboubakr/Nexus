
# ---------- Application ----------
spring.application.name=project-service
server.port=8084

# ---------- Eureka ----------
eureka.client.service-url.defaultZone=http://localhost:8761/eureka
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.prefer-ip-address=true

# ---------- MySQL ----------
spring.datasource.url=jdbc:mysql://localhost:3306/nexus-projet?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ---------- JPA / Hibernate ----------
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ---------- Error responses (Postman debugging) ----------
spring.web.error.include-message=always
spring.web.error.include-binding-errors=always

# ---------- Actuator ----------
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always

# ---------- Application Information ----------
management.info.env.enabled=true
info.app.name=Project-Service
info.app.description=Nexus Project Microservice
info.app.version=1.0.0
